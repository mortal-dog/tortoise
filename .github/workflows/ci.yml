# CI/CD: the gates, then GitHub Pages (D-039, D-046).
#
# When it runs (owner 2026-11-22: twice a day like the owner's other repos, plus a manual run, so that no push or pull
# request starts a run): twice a day on a schedule, doing real work only when main changed since this workflow's last
# green run (the state is GitHub's own run history; nothing is written to the repo). A manual run ("Run workflow" on
# GitHub, or `gh workflow run ci.yml --repo mortal-dog/tortoise`) always runs in full. A red run is not covered: the
# next slot tries again.
#
# How it runs (D-046): the four gates run side by side. "checks" runs pnpm check, pnpm test and pnpm build and uploads
# that dist/ for Pages; three "e2e" shards each install WebKit and run a third of the Playwright tests against their
# own build of the same commit. The build is deterministic (the service worker's version is a hash of the files), so
# the e2e shards test the same files that deploy. The deploy waits for all four and runs only when every one passed,
# only on main, and only once GitHub Pages is set up (docs/3-implementation.md, Phase 8). Pages keeps serving the last
# good deployment when a run fails.
name: CI/CD

on:
  schedule:
    # Cron is UTC and GitHub may start a scheduled run late; minute 7 avoids the top-of-the-hour rush.
    - cron: "7 13 * * *" # 08:07 EST / 09:07 EDT
    - cron: "7 23 * * *" # 18:07 EST / 19:07 EDT
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages after the gates pass
        type: boolean
        default: true

permissions:
  actions: read # the changes job reads this workflow's last green run
  contents: read

concurrency:
  group: ci-cd
  cancel-in-progress: false

jobs:
  # Scheduled runs only; a manual run skips this job and runs in full. A skipped slot costs one runner minute.
  changes:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.last.outputs.run }}
    steps:
      - name: Changed since the last green run
        id: last
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          echo "last green run: ${last:-none} · now: $SHA"
          run=true
          if [ "$last" = "$SHA" ]; then run=false; fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  checks:
    name: check, test, build
    needs: changes
    # !cancelled(): without it, the skipped changes job of a manual run would skip this job too.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.on }}
    env:
      # The personal-term guard's key (D-034). Without it, as in a fork, that one test is skipped.
      TORTOISE_GUARD_KEY: ${{ secrets.TORTOISE_GUARD_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gates (check, test, build)
        run: pnpm check && pnpm test && pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Is GitHub Pages set up
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/pages" --silent 2>/dev/null; then
            echo "on=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not set up for this repo yet (Phase 8), so nothing is deployed."
            echo "on=false" | tee -a "$GITHUB_OUTPUT"
          fi

  e2e:
    name: e2e ${{ matrix.shard }}/3
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # This WebKit draws without a GPU and the glass costs per pixel: render at 1x, not the iPhone's 3x (D-049).
      TORTOISE_E2E_DPR: 1
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Most of this job's time: WebKit's system libraries come from apt (about 55 s); the browser itself takes 4 s.
      - run: pnpm exec playwright install --with-deps webkit
      - name: Gate (e2e, shard ${{ matrix.shard }} of 3)
        run: pnpm e2e --shard=${{ matrix.shard }}/3

  deploy:
    needs: [checks, e2e]
    # Each result is named: a skipped changes job (a manual run) would otherwise skip the deploy too.
    if: >-
      !cancelled() && needs.checks.result == 'success' && needs.e2e.result == 'success' &&
      github.ref == 'refs/heads/main' && needs.checks.outputs.pages == 'true' &&
      (github.event_name == 'schedule' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
